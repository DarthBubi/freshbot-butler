[project]
name = "freshbot-butler"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Johannes Hackbarth", email = "j.hackbarth@cubegaming.de" },
]
dependencies = [
    "langchain==0.0.325",
    "flask[async]==3.0.0",
    "pymongo==4.6.0",
    "openai==0.28.1",
    "chromadb==0.4.16",
    "motor==3.3.1",
    "pysqlite3-binary==0.5.2.post1",
    "tiktoken==0.5.1",
]

[dependency-groups]
dev = [
    "ipykernel==6.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = [
    "onnxruntime<1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["freshbot_butler"]
