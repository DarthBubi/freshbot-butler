[project]
name = "freshbot-butler"
version = "0.1.0"
description = "Freshbot Butler rewrite monorepo backend and worker"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Johannes Hackbarth", email = "j.hackbarth@cubegaming.de" },
]
dependencies = [
    "aiosqlite>=0.20.0,<0.21",
    "asyncpg>=0.29.0,<0.30",
    "fastapi>=0.115.0,<0.116",
    "greenlet>=3.1.1,<4",
    "httpx>=0.28.0,<0.29",
    "pydantic-settings>=2.6.1,<3",
    "python-multipart>=0.0.20,<0.1",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.32.0,<0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
]

[project.scripts]
freshbot-api = "freshbot_butler.api.main:main"
freshbot-worker = "freshbot_butler.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freshbot_butler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
